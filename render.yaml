# Blueprint Render pour l'API COMPLICE (monorepo : build depuis la racine).
# Créer le service : Render Dashboard > New > Blueprint > dépôt Flav-Walk/Projetfintech, branche main.
services:
  - type: web
    name: complice-api
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    buildCommand: npm ci --include=dev --workspace @complice/shared --workspace backend && npm run build --workspace @complice/shared && npm run build --workspace backend
    startCommand: node backend/dist/server.js
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
        - packages/shared/**
        - package.json
        - package-lock.json
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        value: https://uecptmijcjwmzdebeugk.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: APP_SCHEME
        value: complice
      - key: PAYMENT_PROVIDER
        value: simulated
